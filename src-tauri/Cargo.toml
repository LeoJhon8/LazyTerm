[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "2.0.0", features = ["protocol-asset"] } 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 本地 PTY 支持 (保留你原有的功能)
portable-pty = "0.8" 

# 异步 SSH 支持 (方案 B 核心)
russh = "0.45"        # 异步 SSH 协议实现
russh-keys = { version = "0.45", features = ["openssl"] }
openssl = { version = "0.10", features = ["vendored"] }
russh-sftp = "2.1.1"
async-trait = "0.1"   # russh 必须的 trait 宏

# 异步运行时与工具
tokio = { version = "1.0", features = ["full"] } 
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"       # 提供 Stream 处理工具
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-fs = "2.4.5"
base64 = "0.22.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
ironrdp = { version = "0.14.0", features = ["connector", "displaycontrol", "graphics", "input", "session"] }
ironrdp-blocking = "0.8.0"
sspi = { version = "=0.18.7", features = ["network_client"] }
tokio-rustls = "0.26.4"
x509-cert = "0.2.5"
raw-window-handle = "0.6.2"
