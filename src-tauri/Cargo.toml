[package]
name = "app"
version = "26.82.6402"
description = "A modern terminal workspace for Android SSH and multi-protocol desktop sessions"
authors = ["LazyTerm Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/LeoJhon8/LazyTerm"
edition = "2021"
rust-version = "1.85"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["vnc-libvncclient", "rdp-freerdp"]
vnc-libvncclient = []
vnc-rust = []
rdp-freerdp = []

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }
# LibVNCClient FFI 构建依赖
cc = "1.0"
pkg-config = "0.3"
vcpkg = "0.2"

[dependencies]
# Tauri 核心
tauri = { version = "2.0.0", features = ["protocol-asset"] } 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# 异步 SSH 支持
russh = { version = "0.61.1", default-features = false, features = ["ring", "rsa", "flate2"] }
home = "0.5"

# 异步运行时与工具
tokio = { version = "1.0", features = ["full"] } 
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-fs = "2.4.5"
base64 = "0.22.1"
# 日志
log = "0.4"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
portable-pty = "0.8"
russh-sftp = "2.1.1"
reqwest = { version = "0.12", features = ["stream"] }
tokio-stream = "0.1.18"
serialport = "4.3.0"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6.2"
parking_lot = "0.12"
once_cell = "1.19"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
