[package]
name = "app"
version = "26.40.13024"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["vnc-libvncclient"]
vnc-libvncclient = []
vnc-rust = []

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }
# LibVNCClient FFI 构建依赖
cc = "1.0"
pkg-config = "0.3"
vcpkg = "0.2"

[dependencies]
# Tauri 核心
tauri = { version = "2.0.0", features = ["protocol-asset"] } 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# 本地 PTY 支持
portable-pty = "0.8" 

# 异步 SSH 支持
russh = "0.45"
russh-keys = { version = "0.45", features = ["openssl"] }
openssl = { version = "0.10", features = ["vendored"] }
russh-sftp = "2.1.1"
async-trait = "0.1"
home = "0.5"

# 异步运行时与工具
tokio = { version = "1.0", features = ["full"] } 
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-fs = "2.4.5"
base64 = "0.22.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
ironrdp = { version = "0.14.0", features = ["connector", "displaycontrol", "graphics", "input", "session"] }
ironrdp-blocking = "0.8.0"
sspi = { version = "=0.18.7", features = ["network_client"] }
tokio-rustls = "0.26.4"
x509-cert = "0.2.5"
raw-window-handle = "0.6.2"

# LibVNCClient FFI 依赖
parking_lot = "0.12"
once_cell = "1.19"

# 日志
log = "0.4"
tauri-plugin-http = "2"
reqwest = { version = "0.12", features = ["stream"] }
