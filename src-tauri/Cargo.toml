[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] } # 或者 1.x，取决于你的版本
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8" # 核心 PTY 处理
uuid = { version = "1.0", features = ["v4"] } # 用于生成会话 ID
tokio = { version = "1.0", features = ["full"] } # 异步任务
