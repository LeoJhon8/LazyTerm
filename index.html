<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Terminal</title>
    <!-- 保持外部资源引用 -->
    <link rel="stylesheet" href="./src/renderer/styles.css">
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
</head>
<body>
    <div class="terminal-container">
        <!-- 头部区域 -->
        <header class="terminal-header">
            <h1 class="terminal-title">Lazy Terminal</h1>
            <nav class="terminal-controls">
                <button class="icon-btn" id="toggleShortcutBtn" title="切换快捷命令">⚡</button>
                <button class="icon-btn" id="toggleHistoryBtn" title="切换历史记录">📜</button>
            </nav>
        </header>

        <main class="main-content">
            <!-- 左侧会话栏 -->
            <aside class="session-sidebar" id="sessionSidebar">
                <header class="sidebar-header">
                    <span class="title">Sessions</span>
                    <button id="addSessionBtn" class="add-btn" title="新建会话">+</button>
                </header>
                <ul class="session-list" id="sessionList"></ul>
            </aside>

            <!-- 中央核心区 -->
            <section class="right-content">
                <nav class="tabs-container">
                    <div class="tabs-wrapper" id="tabsWrapper"></div>
                    <button id="newTabBtn" class="add-btn" title="新建标签页">+</button>
                </nav>

                <div class="terminal-wrapper" id="terminalWrapper">
                    <div id="xterm-container"></div>
                </div>

                <!-- 底部快捷栏 -->
                <footer class="shortcut-bar" id="shortcutBar">
                    <div id="shortcutList" class="shortcut-list">
                        <!-- 这里的按钮可以通过 JS 动态生成，或保持现状 -->
                        <button class="shortcut-btn" draggable="true" data-command="help">help</button>
                        <button class="shortcut-btn" draggable="true" data-command="clear">clear</button>
                        <button class="shortcut-btn" draggable="true" data-command="history">history</button>
                        <button class="shortcut-btn" draggable="true" data-command="dir">dir</button>
                        <button class="shortcut-btn" draggable="true" data-command="pwd">pwd</button>
                        <button class="shortcut-btn" draggable="true" data-command="echo $USERPROFILE">echo</button>
                    </div>
                    <button id="addShortcutBtn" class="add-btn" title="添加快捷键">+</button>
                </footer>
            </section>

            <!-- 右侧历史记录 -->
            <aside class="history-sidebar" id="historySidebar">
                <header class="sidebar-header">
                    <span class="title">History</span>
                    <button id="clearHistoryBtn" class="clear-btn" title="清空历史">🗑️</button>
                </header>
                <ul class="history-list" id="historyList"></ul>
            </aside>
        </main>
    </div>

    <!-- 使用原生 <dialog> 优化模态框 -->
    
    <!-- 快捷键模态框 -->
    <dialog id="addShortcutModal" class="modal">
        <div class="modal-content">
            <header class="modal-header">
                <h3 id="addShortcutModalTitle">Add New Shortcut</h3>
                <button class="close-btn" data-close>&times;</button>
            </header>
            <form method="dialog" class="modal-body">
                <div class="form-group">
                    <label for="shortcutLabel">Display Text:</label>
                    <input type="text" id="shortcutLabel" placeholder="e.g., ls" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="shortcutCommand">Command:</label>
                    <textarea id="shortcutCommand" placeholder="e.g., dir /b" rows="3"></textarea>
                </div>
                <footer class="modal-footer">
                    <button type="button" class="btn cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn confirm" id="confirmBtn">Add</button>
                </footer>
            </form>
        </div>
    </dialog>

    <!-- 连接模态框 -->
    <dialog id="newConnectionModal" class="modal">
        <div class="modal-content">
            <header class="modal-header">
                <h3>New Connection</h3>
                <button class="close-btn" data-close>&times;</button>
            </header>
            <form method="dialog" class="modal-body">
                <div class="form-group">
                    <label for="connectionType">Type:</label>
                    <select id="connectionType">
                        <option value="local">Local Shell</option>
                        <option value="ssh">SSH</option>
                        <option value="telnet">Telnet</option>
                        <option value="git-bash">Git Bash</option>
                    </select>
                </div>
                
                <!-- SSH 表单组 -->
                <div id="sshFields" class="form-subgroup">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="sshHost">Host:</label>
                            <input type="text" id="sshHost" data-param-key="host" placeholder="192.168.1.1">
                        </div>
                        <div class="form-group">
                            <label for="sshPort">Port:</label>
                            <input type="number" id="sshPort" data-param-key="port" value="22">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="sessionName">Session Name:</label>
                        <input type="text" id="sessionName" data-param-key="name">
                    </div>
                    <div class="form-group">
                        <label for="sshUser">Username:</label>
                        <input type="text" id="sshUser" data-param-key="username">
                    </div>
                    <div class="form-group">
                        <label for="sshPassword">Password:</label>
                        <input type="password" id="sshPassword" data-param-key="password">
                    </div>
                    <div class="form-group">
                        <label for="sshKeyPath">Private Key Path:</label>
                        <input type="text" id="sshKeyPath" data-param-key="keyPath">
                    </div>
                </div>

                <!-- Telnet 表单组 -->
                <div id="telnetFields" class="form-subgroup" style="display: none;">
                    <div class="form-group">
                        <label for="telnetHost">Host:</label>
                        <input type="text" id="telnetHost" data-param-key="host">
                    </div>
                    <div class="form-group">
                        <label for="telnetPort">Port:</label>
                        <input type="number" id="telnetPort" value="23" data-param-key="port">
                    </div>
                </div>

                <footer class="modal-footer">
                    <button type="submit" class="btn confirm" id="connectBtn">Save Connection</button>
                </footer>
            </form>
        </div>
    </dialog>

    <!-- 右键上下文菜单 -->
    <nav class="context-menu" id="shortcutContextMenu">
        <button class="context-menu-item" id="editShortcutBtn">✏️ Edit</button>
        <button class="context-menu-item danger" id="deleteShortcutBtn">🗑️ Delete</button>
    </nav>

    <script type="module">
      import TerminalMain from './src/renderer/terminal-main.js';

      document.addEventListener('DOMContentLoaded', () => {
        const app = new TerminalMain({
          tabsWrapperId: 'tabsWrapper',
          newTabBtnId: 'newTabBtn',
        });
        app.init();
        app.createNewTab();
      });
    </script>
</body>
</html>
