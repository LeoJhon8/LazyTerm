name: Build macOS ARM64 App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # 手动触发
  workflow_dispatch:
  # 当推送带有版本号的 tag 时触发（例如 v1.0.0）
  push:
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 仅构建 Apple Silicon (ARM64)
          targets: aarch64-apple-darwin

      - name: Install System Dependencies
        run: brew install libvncserver freerdp

      - name: Install frontend dependencies
        run: npm ci

      - name: Update App Version
        run: node scripts/update-version.js

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: --target aarch64-apple-darwin

      - name: Upload macOS ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-ARM64-Installers
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
