name: Mirror code to Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-gitee-main
  cancel-in-progress: true

jobs:
  sync-code:
    name: Mirror main branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY || 'LeoJohn8/LazyTerm' }}
      GIT_TERMINAL_PROMPT: 0
    steps:
      - name: Validate mirror configuration
        shell: bash
        run: |
          if [[ -z "$GITEE_USERNAME" || -z "$GITEE_TOKEN" ]]; then
            echo "GITEE_USERNAME and GITEE_TOKEN secrets are required." >&2
            exit 1
          fi
          if [[ ! "$GITEE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "GITEE_REPOSITORY must use owner/repository format." >&2
            exit 1
          fi

      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to Gitee with retries
        shell: bash
        run: |
          git fetch --no-tags origin main
          bash scripts/push-ref-to-gitee.sh FETCH_HEAD refs/heads/main
