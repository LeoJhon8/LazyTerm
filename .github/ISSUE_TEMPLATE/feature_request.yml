name: Feature Request
description: 建议新的能力或体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先搜索现有 Issue，并重点描述使用场景和期望结果。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 当前在什么情况下遇到了限制或额外工作？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述理想行为；不要求提供完整技术设计。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
  - type: dropdown
    id: platforms
    attributes:
      label: 适用平台
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - 全平台
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过现有 Issue，没有发现相同建议。
          required: true
        - label: 此建议不包含安全漏洞细节或敏感数据。
          required: true
